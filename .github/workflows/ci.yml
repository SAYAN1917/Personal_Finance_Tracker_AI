name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: service/pyproject.toml

      - name: Install package + dev deps
        run: |
          pip install -e ".[dev]"

      - name: Lint (ruff F-class: real unused/undefined)
        run: ruff check --select F app/ tests/

      - name: Run tests
        run: pytest -q
