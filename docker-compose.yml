# Finance Tracker stack: Postgres + API + Telegram bot.
# Copy service/.env.example -> .env and fill in real values, then:
#   docker compose up -d --build
#
# The API listens on 127.0.0.1:8000 (private). Put Nginx + TLS in front and
# expose only /webhook/* (see service/deploy/PRODUCTION.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: finance
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./service
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      FINANCE_ENV: prod
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD}@db:5432/finance
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set in .env}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      LOG_DIR: /srv/finance/logs
      USER_LLM_API_KEY: ${USER_LLM_API_KEY:-}
      USER_LLM_BASE_URL: ${USER_LLM_BASE_URL:-}
      USER_LLM_MODEL: ${USER_LLM_MODEL:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: ./service
    restart: unless-stopped
    command: finance-bot
    environment:
      FINANCE_ENV: prod
      DATABASE_URL: postgresql://finance:${POSTGRES_PASSWORD}@db:5432/finance
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set in .env}
      ADMIN_USER_ID: ${ADMIN_USER_ID:?set in .env}
      QUIET_HOURS_START: ${QUIET_HOURS_START:-23}
      QUIET_HOURS_END: ${QUIET_HOURS_END:-7}
      SHARED_PROMPT_THRESHOLD: ${SHARED_PROMPT_THRESHOLD:-500}
      LOG_DIR: /srv/finance/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
