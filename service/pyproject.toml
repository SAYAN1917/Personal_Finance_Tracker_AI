[project]
name = "finance-tracker"
version = "0.1.0"
description = "Personal finance tracker - core API (parsing, dedup, settlements, ledger)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "httpx>=0.27,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "alembic>=1.13,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
finance-bot = "app.bot:run_bot_forever"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["deploy*", "scripts*", "tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
